name: CI
on: [push, pull_request]
jobs:
  ci:
    uses: voyagi/.github-workflows/.github/workflows/node-ci.yml@main
    with:
      # Every one of these defaults to false in the shared workflow, so passing
      # only run-knip left CI running `npm ci` plus Biome and nothing else: the
      # whole test suite was skipped on every run, and a green check meant only
      # that formatting passed.
      run-build: true
      run-tests: true
      run-trivy: true
      run-knip: false
    secrets: inherit
